<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Olist Marketplace{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .sidebar { min-height: 100vh; background: #1a2340; }
    .sidebar .nav-link { color: #b0b8d1; border-radius: 8px; margin-bottom: 2px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2d3a5e; color: #fff; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.2rem; }
    .risk-alto  { background: #fde8e8; color: #b91c1c; }
    .risk-medio { background: #fef3c7; color: #92400e; }
    .risk-bajo  { background: #d1fae5; color: #065f46; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.07); border-radius: 12px; }
  </style>
</head>
<body>
<div class="d-flex">
  <nav class="sidebar p-3 d-flex flex-column" style="width:230px; min-width:230px;">
    <a href="{% url 'marketplace:dashboard' %}" class="brand mb-4 text-decoration-none">
      <i class="bi bi-shop me-2"></i> Olist Risk
    </a>
    <ul class="nav flex-column flex-grow-1">
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
           href="{% url 'marketplace:dashboard' %}">
          <i class="bi bi-speedometer2 me-2"></i>Home
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'marketplace:order_list' %}">
          <i class="bi bi-bag me-2"></i>Órdenes
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'marketplace:product_list' %}">
          <i class="bi bi-box-seam me-2"></i>Productos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'customer' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'marketplace:customer_list' %}">
          <i class="bi bi-people me-2"></i>Clientes
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'seller' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'marketplace:seller_list' %}">
          <i class="bi bi-person-badge me-2"></i>Vendedores
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'marketplace:category_list' %}">
          <i class="bi bi-tags me-2"></i>Categorías
        </a>
      </li>
      <li class="nav-item mt-3">
        <a class="nav-link {% if 'risk' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'marketplace:risk_dashboard' %}">
          <i class="bi bi-shield-exclamation me-2"></i>Panel de Riesgo
        </a>
      </li>
    </ul>
    <div class="mt-auto pt-3 border-top border-secondary">
      <a class="nav-link" href="/admin/" target="_blank">
        <i class="bi bi-gear me-2"></i>Admin Django
      </a>
      <a class="nav-link" href="/modelo/">
        <i class="bi bi-cpu me-2"></i>Info Modelo
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 p-4">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show" role="alert">
          {{ msg }} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
